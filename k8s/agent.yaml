apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels: {app.kubernetes.io/name: agent}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agent}
    spec:
      automountServiceAccountToken: false   # the agent never talks to the Kubernetes API
      # No Docker-link style service variables: Kubernetes would inject CHROMA_PORT=tcp://...
      # for the chroma Service, which Chroma reads as its own (numeric) port setting and crashes.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: factory-energy-agent
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: agent-config}
            - secretRef: {name: agent-secrets}
          readinessProbe:     # the database and the knowledge base can be queried
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:      # the process answers
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: plant-data, mountPath: /app/data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: logs, mountPath: /app/logs}
      volumes:
        - name: plant-data
          persistentVolumeClaim: {claimName: plant-data, readOnly: true}
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  selector: {app.kubernetes.io/name: agent}
  ports:
    - {name: http, port: 8000, targetPort: http}
