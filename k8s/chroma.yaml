apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
  labels: {app.kubernetes.io/name: chroma}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: chroma}
  template:
    metadata:
      labels: {app.kubernetes.io/name: chroma}
    spec:
      automountServiceAccountToken: false
      # No Docker-link style service variables: Kubernetes would inject CHROMA_PORT=tcp://...
      # for the chroma Service, which Chroma reads as its own (numeric) port setting and crashes.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chroma
          image: chromadb/chroma:1.5.9
          env:
            - {name: ANONYMIZED_TELEMETRY, value: "FALSE"}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        # The index is derived data: the plant-data Job rebuilds it from the documents. An
        # emptyDir honours fsGroup, so Chroma can run as a non-root user on any storage class
        # (kind's local-path volumes are owned by root and ignore fsGroup).
        - name: data
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
spec:
  selector: {app.kubernetes.io/name: chroma}
  ports:
    - {name: http, port: 8000, targetPort: http}
