# Evaluation set for the energy agent. All data is synthetic (fictional DemoTronics plant).
#
# expect.numbers  - values the answer must contain; `golden` names a value computed directly
#                   from the database by factory_energy.evaluation.golden (eval/golden.json),
#                   `tolerance` is absolute in the value's unit; `also_fraction` accepts a
#                   percentage written as a fraction (1.9 % or 0.019).
# expect.phrases  - every group must match; any phrase within a group is enough (case-insensitive).
# expect.refusal  - the answer must decline (no fabricated result).
# expect.forbidden - strings that must not appear in the answer.
# tools           - tools that must be called successfully; "a|b" accepts either.
# forbidden_tools - tools that must not be called successfully.
# sources         - at least one must be cited with a verified [source: ...] citation. Every
#                   document that states the fact is listed (the corpus repeats key figures).
# tags            - `smoke` questions are answerable on the small CI database (Jun 9 - Jul 27).

- id: N01
  category: numeric
  tags: [smoke]
  question: What was the highest 15-minute demand on 16 June 2025, and in which interval?
  expect:
    numbers: [{golden: s2_peak_kw, tolerance: 1.0}]
    phrases: [["08:15"]]
  tools: [get_demand]

- id: N02
  category: numeric
  tags: [smoke]
  question: How many 15-minute intervals exceeded the contract capacity on 23 and 24 July 2025 together?
  expect:
    numbers: [{golden: s3_intervals_over_contract, tolerance: 0}]
  tools: [get_demand]

- id: N03
  category: numeric
  tags: [smoke]
  question: How much energy did the whole plant use from 1 July 2025 00:00 to 8 July 2025 00:00, in kWh?
  expect:
    numbers: [{golden: plant_kwh_jul_1_7, tolerance: 500}]
  tools: [get_energy|compute_stats]

- id: N04
  category: numeric
  question: Which distribution board used the most energy in June 2025, and how many kWh did it use?
  expect:
    numbers: [{golden: top_feeder_kwh_june, tolerance: 300}]
    phrases: [["MDB-4", "HVAC"]]
  tools: [get_energy]

- id: N05
  category: numeric
  question: How much energy did reflow oven RF-02 use between Friday 17 October 2025 12:00 and Monday 20 October 2025 12:00, in kWh?
  expect:
    numbers: [{golden: rf02_weekend_kwh, tolerance: 20}]
  tools: [compute_stats|get_energy|get_meter_series]

- id: N06
  category: numeric
  question: What was the average power factor of board MDB-3 between 08:00 and 17:00 on 5 November 2025?
  expect:
    numbers: [{golden: mdb3_pf_nov5_day, tolerance: 0.01}]
  tools: [compute_stats|get_meter_series]

- id: N07
  category: numeric
  question: What was the plant's night base load (median plant demand between 02:00 and 05:00) on 6 August 2025, in kW?
  expect:
    numbers: [{golden: plant_night_base_aug6, tolerance: 10}]
  tools: [compute_stats|get_meter_series|get_demand]

- id: N08
  category: numeric
  tags: [smoke]
  question: If the machines in the 16 June 2025 simultaneous start (scenario S2) had been started 15 minutes apart, what would the peak 15-minute demand have been?
  expect:
    numbers: [{golden: s2_staggered_peak_kw, tolerance: 2.0}]
  tools: [whatif_staggered_start]

- id: N09
  category: numeric
  question: What was the plant's energy charge in NT$ for the week from 4 August 2025 00:00 to 11 August 2025 00:00? Energy charge only, without demand charges.
  expect:
    numbers: [{golden: plant_energy_cost_aug_week, tolerance: 3000}]
  tools: [get_energy]

- id: N10
  category: numeric
  question: At 13:20 on 23 July 2025, what was the highest probability (in percent) that the plant would exceed its contract capacity within the next hour, according to the lightgbm forecast?
  expect:
    numbers: [{golden: forecast_pexceed_jul23_1320_pct, tolerance: 0.6, also_fraction: true}]
  tools: [get_forecast]

- id: K01
  category: knowledge
  tags: [smoke]
  question: How long does a reflow oven preheat when it is switched on before its SMT line starts?
  expect:
    phrases: [["45"]]
  tools: [search_knowledge]
  sources: [docs/knowledge/equipment/EQ-01_reflow_oven.md, docs/knowledge/sop/SOP-01_monday_startup.md,
            docs/simulator.md, docs/scenarios.md, docs/dashboard.md]

