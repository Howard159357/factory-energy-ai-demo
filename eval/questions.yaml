- id: M01
  category: multi_tool
  tags: [smoke]
  question: What was the peak demand during the 16 June 2025 start-up incident, what caused it, and what would a 15-minute stagger have achieved?
  expect:
    numbers: [{golden: s2_peak_kw, tolerance: 1.0}, {golden: s2_staggered_peak_kw, tolerance: 2.0}]
  tools: [get_demand|list_detections, whatif_staggered_start]

- id: M02
