id: S8
title: Capacitor bank fault lowers power factor
caption: "Capacitor bank trips: power factor 0.96 to 0.84"
description: >
  The power-factor correction capacitor bank on the injection-molding feeder trips. Reactive power
  is no longer compensated and the feeder power factor drops until maintenance repairs it.
