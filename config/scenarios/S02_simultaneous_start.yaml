id: S2
title: Monday morning simultaneous start
caption: "08:00, everything starts at once: 1,324 kW, above the contract"
description: >
  After the weekend, operators switch on all four injection molders, the three reflow ovens, the
  wave solder machine, the large chiller and the standby air compressor at 08:00 sharp. The start-up surges overlap and push
  the 15-minute demand above the contract capacity.
