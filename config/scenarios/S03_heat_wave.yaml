id: S3
title: Heat wave pushes demand toward the limit
caption: "Heat wave: sustained overruns are warned 30 to 75 minutes ahead"
description: >
  A three-day heat wave raises afternoon temperatures well above normal. The chillers run at full
  load and lose efficiency, and the plant's 15-minute demand approaches and repeatedly exceeds the
  contract capacity by a small margin on the two hottest afternoons.
